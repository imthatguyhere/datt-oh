[package]
name = "datt-oh"
version = "0.0.17"
description = "Datt-Oh! — Datto RMM Agent Installer"
authors = ["imthatguyhere"]
edition = "2021"

[lib]
name = "datt_oh_lib"
crate-type = ["lib", "staticlib"]

[[bin]]
name = "datt-oh"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "process"] }
dotenvy = "0.15"
thiserror = "2"

[features]
#=-- This feature is used for production builds or when a dev server is not specified.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z" #=-- or "s" if you have a lot of loops
panic = "abort"
strip = true #=-- removes debug symbols
